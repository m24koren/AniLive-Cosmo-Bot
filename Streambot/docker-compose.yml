name: streambot

x-app: &app
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &app-env
    APP_ENV: development
    DATABASE_URL: postgresql://streambot:streambot@postgres:5432/streambot
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: streambot
      POSTGRES_PASSWORD: streambot
      POSTGRES_DB: streambot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streambot -d streambot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *app-env
      WORKER_EMBEDDED: "false"
      PORT: "8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *app-env

  bot:
    <<: *app
    profiles: ["polling"]
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    environment:
      <<: *app-env
      BOT_MODE: polling

volumes:
  pgdata:
